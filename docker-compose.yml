services:

  # ── Aplicación: nginx + PHP-FPM (supervisord) ───────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gestion-ldap:latest
    container_name: gestion-ldap-app
    restart: unless-stopped
    runtime: crun
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: gestion_ldap
      
      LDAP_PORT: 389
    ports:
      - "${EXTERNAL_PORT:-8083}:80"
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Base de datos MySQL ─────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: gestion-ldap-mysql
    restart: unless-stopped
    runtime: crun
    environment:
      MYSQL_DATABASE: gestion_ldap
      MYSQL_USER: gestion_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "gestion_user", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  ldap:
    image: osixia/openldap:1.5.0
    container_name: gestion-ldap-openldap
    runtime: crun
    privileged: true
    restart: 'no'
    environment:
      LDAP_ROOT: "dc=iespacifico,dc=es"
      LDAP_ADMIN_USERNAME: "admin"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD}"
      LDAP_PORT_NUMBER: "389"
      LDAP_ENABLE_TLS: "no"
      LDAP_SKIP_DEFAULT_TREE: "yes"
      LDAP_ALLOW_ANON_BINDING: "no"
    ports:
      - "${LDAP_BIND_INTERFACE:-0.0.0.0}:${LDAP_EXPOSE_PORT:-389}:389"
    volumes:
      - openldap_data:/bitnami/openldap
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  mysql_data:
    driver: local
  openldap_data:
    driver: local
  openldap_config:
    driver: local
  app_storage:
    driver: local
  app_public:
    driver: local

# ── Red interna aislada ─────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge

services:

  # ── Aplicación: nginx + PHP-FPM ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gestion-ldap-app:latest
    container_name: gestion-ldap-app
    restart: unless-stopped
    # runtime: crun   # Descomentar si el servidor usa Proxmox LXC
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: gestion_ldap
      LDAP_HOST: ldap
      LDAP_PORT: 389
    ports:
      - "${EXTERNAL_PORT:-8083}:80"
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    depends_on:
      mysql:
        condition: service_healthy
      ldap:
        condition: service_healthy
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Base de datos MySQL ─────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: gestion-ldap-mysql
    restart: unless-stopped
    # runtime: crun   # Descomentar si el servidor usa Proxmox LXC
    environment:
      MYSQL_DATABASE: gestion_ldap
      MYSQL_USER: gestion_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "gestion_user", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Servidor OpenLDAP (imagen propia basada en Ubuntu 22.04) ─────────────────
  ldap:
    build:
      context: docker-ldap/
      dockerfile: Dockerfile
    image: gestion-ldap-openldap:latest
    container_name: gestion-ldap-openldap
    restart: unless-stopped
    # runtime: crun   # Descomentar si el servidor usa Proxmox LXC
    env_file: .env
    environment:
      CENTER_NAME: "${CENTER_NAME:-Mi Centro}"
    ports:
      # Expone LDAP al host para que otras apps del servidor puedan conectar.
      # LDAP_BIND_INTERFACE=127.0.0.1 → solo acceso local
      # LDAP_BIND_INTERFACE=0.0.0.0  → acceso desde la red (necesario si hay apps en otros servidores)
      - "${LDAP_BIND_INTERFACE:-0.0.0.0}:${LDAP_EXPOSE_PORT:-389}:389"
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://127.0.0.1/", "-b", "", "-s", "base"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ── Volúmenes persistentes ────────────────────────────────────────────────────
volumes:
  mysql_data:
  openldap_data:
  openldap_config:
  app_storage:
  app_public:

# ── Red interna aislada ───────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
